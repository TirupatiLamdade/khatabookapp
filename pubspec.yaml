name: login_setup
description: "Khatabook Smart - Production Grade Enterprise Ledger Platform"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # 🪙 State Management & Connectivity
  flutter_riverpod: ^3.3.2
  url_launcher: ^6.3.2

  # 🧭 Routing & Navigation
  go_router: ^17.3.0

  # 🔥 Firebase Suite
  firebase_core: ^3.1.0
  firebase_auth: ^5.7.0
  cloud_firestore: ^5.6.12
  firebase_storage: ^12.0.1
  firebase_messaging: ^15.2.10

  # 📦 Local Cache & Encryption Storage (Offline First)
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^9.2.2
  crypto: ^3.0.3

  # 🛡️ Hardware & Biometrics Authentication
  local_auth: ^3.0.2

  # 🌐 Network & Device Utilities
  connectivity_plus: ^6.0.3
  intl: ^0.19.0
  share_plus: ^12.0.2
  image_picker: ^1.1.2

  # 📊 Export Engines & Utilities
  pdf: ^3.10.8
  excel: ^4.0.6
  flutter_local_notifications: ^22.0.1
  universal_html: ^2.3.0
  google_sign_in: ^7.2.0
  google_fonts: ^8.2.0
  google_generative_ai: ^0.4.7
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  # 🚀 Moved here where code generation tooling belongs
  flutter_launcher_icons: ^0.14.4

# 🎨 Launcher Icon Configuration
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21

  # Web Manifest Config
  web:
    generate: true
    image_path: "assets/icon/icon.png"
    background_color: "#FFFFFF"
    theme_color: "#000000"

  # Windows Icon Config
  windows:
    generate: true
    image_path: "assets/icon/icon.png"
    icon_size: 48

flutter:
  uses-material-design: true

  # 🖼️ Un-comment and point to your icon folder
  assets:
    - assets/icon/